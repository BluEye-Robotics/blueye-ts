name: Publish Package

on: [push]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          lfs: true

      - uses: pnpm/action-setup@v5
        name: Install pnpm
        with:
          # Version comes from the "packageManager" field in package.json
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test

      - if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm publish --no-git-checks --access public --tag latest

      - name: Trigger blueye-ts bump in downstream repos
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.BLUEYE_PROTOCOL_BUMP_PAT }}
        run: |
          VERSION=$(pnpm pkg get version | tr -d '"')
          for repo in BluEye-Robotics/p2-django BluEye-Robotics/dive-viewer; do
            gh api "repos/${repo}/dispatches" \
              -f event_type=blueye-ts-update \
              -f "client_payload[version]=${VERSION}"
          done
